<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
<title id="t">RequestRocket</title>
<desc id="d">Runtime access control for AI agents and APIs. Consumers call the data plane, which calls third-party APIs. Connect. Control. Govern. Observe.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

.kicker { fill: #94A3B8; font-size: 12px; font-weight: 650; letter-spacing: 2.2px; }
.headline { fill: #F1F5F9; font-size: 32px; font-weight: 650; letter-spacing: -0.4px; }
.box-title { fill: #F1F5F9; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
.pill { fill: #94A3B8; font-size: 15px; font-weight: 550; }
.name { fill: #F1F5F9; font-size: 15px; font-weight: 600; }
.tag { fill: #94A3B8; font-size: 13px; font-weight: 500; }
.verb { fill: #94A3B8; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }

.box { animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both; }
.conn { stroke: #FF006B; stroke-opacity: 0.55; stroke-width: 2; stroke-dasharray: 6 6; fill: none;
  stroke-dashoffset: 0; animation: draw 1.1s cubic-bezier(.6,0,.2,1) both; }
.pkt { fill: #FF006B; transform-box: view-box; transform-origin: 0 0;
  animation: travel 8s linear infinite; }
.pkt-glow { fill: #FF006B; opacity: 0.35; transform-box: view-box; transform-origin: 0 0;
  animation: travel 8s linear infinite; }
.s1 { animation: stage1 8s linear infinite; }
.s2 { animation: stage2 8s linear infinite; }
.s3 { animation: stage3 8s linear infinite; }
.tp { animation: third 8s linear infinite; }
.v { animation: verb 8s linear infinite; }
.sw { animation: sw 8s linear infinite; }

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes draw {
  from { stroke-dashoffset: 84; }
  to { stroke-dashoffset: 0; }
}
@keyframes travel {
  0%   { transform: translate(348px, 272px); opacity: 0; }
  2%   { opacity: 1; }
  12%  { transform: translate(420px, 272px); opacity: 1; }
  14%  { opacity: 0; }
  54%  { opacity: 0; transform: translate(848px, 272px); }
  56%  { opacity: 1; }
  68%  { transform: translate(920px, 272px); opacity: 1; }
  74%  { transform: translate(920px, 272px); opacity: 1; }
  86%  { transform: translate(848px, 272px); opacity: 1; }
  88%  { opacity: 0; transform: translate(420px, 272px); }
  90%  { opacity: 1; }
  98%  { transform: translate(348px, 272px); opacity: 1; }
  100% { opacity: 0; }
}
@keyframes stage1 {
  0%, 12% { stroke: #1E2D45; }
  14%, 26% { stroke: #FF006B; }
  28%, 100% { stroke: #1E2D45; }
}
@keyframes stage2 {
  0%, 26% { stroke: #1E2D45; }
  28%, 40% { stroke: #FF006B; }
  42%, 100% { stroke: #1E2D45; }
}
@keyframes stage3 {
  0%, 40% { stroke: #1E2D45; }
  42%, 54% { stroke: #FF006B; }
  56%, 100% { stroke: #1E2D45; }
}
@keyframes third {
  0%, 66% { stroke: rgba(124, 58, 237, 0.35); }
  68%, 86% { stroke: rgba(255, 0, 107, 0.7); }
  88%, 100% { stroke: rgba(124, 58, 237, 0.35); }
}
@keyframes verb {
  0%, 22% { fill: #F1F5F9; }
  28%, 100% { fill: #94A3B8; }
}
@keyframes sw {
  0%, 22% { opacity: 1; }
  28%, 100% { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
  .box, .conn, .pkt, .pkt-glow, .s1, .s2, .s3, .tp, .v, .sw { animation: none; }
  .pkt, .pkt-glow { opacity: 0; }
}
</style>
<defs>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FF006B"/>
<stop offset="0.55" stop-color="#7C3AED"/>
<stop offset="1" stop-color="#06B6D4"/>
</linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="3"/>
</filter>
<clipPath id="frame"><rect width="1280" height="480" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="480" fill="#060B18"/>

<text class="kicker" x="56" y="40">REQUESTROCKET</text>
<text class="kicker" x="1224" y="40" text-anchor="end">AI &#183; API &#183; MCP</text>

<text class="headline" x="56" y="92">Runtime access control for AI agents and APIs.</text>
<rect x="56" y="112" width="280" height="3" fill="url(#rule)"/>

<g class="box" style="animation-delay:0.05s">
<rect x="56" y="156" width="292" height="232" rx="20" fill="#100C22" stroke="rgba(124,58,237,0.35)"/>
<rect x="76" y="144" width="128" height="24" rx="12" fill="#060B18" stroke="rgba(124,58,237,0.45)"/>
<text class="box-title" x="140" y="160" text-anchor="middle">CONSUMERS</text>
<rect x="80" y="214" width="244" height="40" rx="20" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="202" y="234" text-anchor="middle" dominant-baseline="middle">Agents</text>
<rect x="80" y="278" width="244" height="40" rx="20" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="202" y="298" text-anchor="middle" dominant-baseline="middle">Applications</text>
</g>

<g class="box" style="animation-delay:0.18s">
<rect x="432" y="148" width="416" height="248" rx="20" fill="#1A0C16" stroke="rgba(255,0,107,0.4)"/>
<rect x="452" y="136" width="132" height="24" rx="12" fill="#060B18" stroke="rgba(255,0,107,0.45)"/>
<text class="box-title" x="518" y="152" text-anchor="middle">DATA PLANE</text>
<text class="name" x="456" y="190" dominant-baseline="middle">Data Plane</text>
<text class="tag" x="812" y="190" text-anchor="end" dominant-baseline="middle">runtime proxy</text>
<rect class="s1" x="456" y="214" width="368" height="42" rx="12" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="640" y="235" text-anchor="middle" dominant-baseline="middle">Authentication</text>
<rect class="s2" x="456" y="266" width="368" height="42" rx="12" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="640" y="287" text-anchor="middle" dominant-baseline="middle">Authorization</text>
<rect class="s3" x="456" y="318" width="368" height="42" rx="12" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="640" y="339" text-anchor="middle" dominant-baseline="middle">Redaction</text>
</g>

<g class="box" style="animation-delay:0.32s">
<rect class="tp" x="932" y="156" width="292" height="232" rx="20" fill="#100C22" stroke="rgba(124,58,237,0.35)"/>
<rect x="952" y="144" width="156" height="24" rx="12" fill="#060B18" stroke="rgba(124,58,237,0.45)"/>
<text class="box-title" x="1030" y="160" text-anchor="middle">3RD PARTY APIS</text>
<rect x="956" y="198" width="244" height="40" rx="20" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="1078" y="218" text-anchor="middle" dominant-baseline="middle">AI</text>
<rect x="956" y="250" width="244" height="40" rx="20" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="1078" y="270" text-anchor="middle" dominant-baseline="middle">Payments</text>
<rect x="956" y="302" width="244" height="40" rx="20" fill="#0D1526" stroke="#1E2D45"/>
<text class="pill" x="1078" y="322" text-anchor="middle" dominant-baseline="middle">CRM</text>
</g>

<line class="conn" x1="348" y1="272" x2="432" y2="272" style="animation-delay:0.35s"/>
<line class="conn" x1="848" y1="272" x2="932" y2="272" style="animation-delay:0.5s"/>
<circle class="pkt-glow" r="8" filter="url(#glow)"/>
<circle class="pkt" r="4"/>

<rect class="sw" x="56" y="436" width="8" height="8" rx="1" fill="#06B6D4"/>
<text class="verb v" x="72" y="444">CONNECT.</text>
<rect class="sw" x="196" y="436" width="8" height="8" rx="1" fill="#FF006B" style="animation-delay:2s"/>
<text class="verb v" x="212" y="444" style="animation-delay:2s">CONTROL.</text>
<rect class="sw" x="336" y="436" width="8" height="8" rx="1" fill="#7C3AED" style="animation-delay:4s"/>
<text class="verb v" x="352" y="444" style="animation-delay:4s">GOVERN.</text>
<rect class="sw" x="464" y="436" width="8" height="8" rx="1" fill="#06B6D4" style="animation-delay:6s"/>
<text class="verb v" x="480" y="444" style="animation-delay:6s">OBSERVE.</text>
</g>
</svg>
